[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cap-inspector"
version = "0.1.0"
description = "Camera-based cap inspection service for robot operation verification"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python",
    "Pillow",
    "grpc-frame",
    "x-logger",
]

[tool.setuptools.packages.find]
where = ["src"]
