[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cap_inspector"
version = "0.1.0"
description = "OpenCV-based cap position and opening-state inspection over gRPC"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy",
    "opencv-python",
    "PySide6",
    "grpc-frame",
    "xlogger-py",
]

[tool.setuptools.packages.find]
where = ["src"]
